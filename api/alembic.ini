# Alembic configuration. The database URL is deliberately absent here: alembic/env.py
# reads it from core.config, so migrations and the API can never disagree about which
# database they are pointed at, and no credential is ever committed.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revisions are numbered by hand (0001, 0002, ...) so the order is obvious in a diff
# and two people branching at once get an obvious conflict rather than a silent one.
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
