# One command starts the whole stack: `docker compose up --build`
#
#   web  http://localhost:5173   Vite dev server (React + TS + Tailwind)
#   api  http://localhost:8000   FastAPI, /health, /docs
#   db   localhost:5432          PostgreSQL 16 (set POSTGRES_PORT if 5432 is taken)
#
# Every value has a default so the stack also starts from a clean clone with no .env
# (this is how CI brings it up). Copy .env.example to .env to override any of them.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connectsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectsphere}
      POSTGRES_DB: ${POSTGRES_DB:-connectsphere}
    ports:
      # Host port is configurable: a local PostgreSQL install or another project's
      # container very often already owns 5432. Only the left-hand side changes —
      # inside the Compose network the API always reaches the database on db:5432.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Named volume, so `docker compose down` keeps your data and `down -v` wipes it.
      - connectsphere_db_data:/var/lib/postgresql/data
    healthcheck:
      # `api` waits on this, so migrations never race an unready database.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-connectsphere} -d ${POSTGRES_DB:-connectsphere}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    # Migrations, then the idempotent dev seed, then the reloading dev server. Doing this
    # here rather than in the Dockerfile keeps the image immutable and the schema current,
    # and means a clean clone (or CI's e2e job) can sign in without a manual step.
    command: >
      sh -c "alembic upgrade head
      && PYTHONPATH=/app python /scripts/seed.py
      && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://connectsphere:connectsphere@db:5432/connectsphere}
      # core/config.py has no default for this, on purpose. The default lives here,
      # in the local development environment, so `docker compose up` works from a
      # clean clone — it is not a secret and must never be used anywhere real.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '8000:8000'
    volumes:
      # Bind mount + --reload: edit a file on your machine, the API restarts itself.
      - ./api:/app
      # Read-only, and mounted at /scripts so that `../scripts/traceability.py` resolves
      # from /app exactly as it does from api/ on a developer machine and in CI.
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: ./web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # The browser only ever talks to :5173; Vite forwards /api and /health to this target.
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
    ports:
      - '5173:5173'
    volumes:
      - ./web:/app
      # Anonymous volume so the container keeps the node_modules it installed at build
      # time instead of having them shadowed by the host bind mount above.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  connectsphere_db_data:
