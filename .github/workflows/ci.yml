name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests, coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connectsphere"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://connectsphere:connectsphere@localhost:5432/connectsphere_test
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: api
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        working-directory: api
        run: mypy .

      # Migrations must run cleanly from an empty database, every time.
      - name: Apply migrations
        working-directory: api
        run: alembic upgrade head

      - name: Tests with coverage
        working-directory: api
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      # The domain layer is pure and has no excuse for uncovered lines.
      - name: Domain coverage must be 100%
        working-directory: api
        run: coverage report --include='*/domain/*' --fail-under=100

      # Deliverable 3: story -> test traceability, generated rather than hand-maintained.
      - name: Generate traceability matrix
        working-directory: api
        run: python ../scripts/traceability.py tests > traceability.md

      - uses: actions/upload-artifact@v7
        with:
          name: traceability-matrix
          path: api/traceability.md

  frontend:
    name: Frontend — lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the whole stack the way a marker would
        run: docker compose up -d --build
        
      - name: Show API logs if startup fails
        if: failure()
        run: |
          docker compose ps
          docker compose logs api --tail=200

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; docker compose logs; exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
