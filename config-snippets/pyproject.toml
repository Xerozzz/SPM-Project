# Drop into api/pyproject.toml (merge with what you already have).
# The parts that matter for the governance pack are marked.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"          # --strict-markers turns a typo'd marker into an error
markers = [
  "story(id): the user story this test provides evidence for",   # <-- traceability
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
# Every exclusion needs a reason next to it in the code. The brief asks for coverage
# to be justified where it is not complete.
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit — catches string-built SQL, weak crypto, hardcoded secrets
  "DTZ",           # flake8-datetimez — enforces timezone-aware datetimes (AGENTS.md §3)
  "ARG",           # unused arguments
  "SIM",           # simplify
  "TID",           # tidy-imports — used below to enforce the layering from ADR-0003
]
ignore = ["S101"]  # assert is fine in tests

# Enforce the layering from ADR-0003 mechanically rather than by review discipline:
# domain/ may not import the ORM or the web framework. The ban is declared globally and
# then lifted (TID251) everywhere except domain/, because ruff has no "only here" form.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "domain/ must stay I/O-free — see ADR-0003"
"fastapi".msg = "domain/ must stay framework-free — see ADR-0003"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "TID251"]
"routers/*" = ["TID251"]
"services/*" = ["TID251"]
"repositories/*" = ["TID251"]
"models/*" = ["TID251"]
"schemas/*" = ["TID251"]
"core/*" = ["TID251"]
"alembic/*" = ["TID251", "S", "ARG"]
"main.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
